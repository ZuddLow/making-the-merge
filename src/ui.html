  const group = (p, title) => {
    const list = G.gone.filter(x => x.owner === p);
    return `<div class="gone"><h3>${title} <span class="eyebrow">${list.length}</span></h3>${list.length ? `<div class="gonegrid">${list.map(x => `<button class="tile" data-gone="${x.uid}">${cardHTML(x.id)}<span>${why[x.why]} · T${x.turn}</span></button>`).join('')}</div>` : '<p>None yet.</p>'}</div>`;
  };
  $('panel').className = 'panel';
  $('panel').innerHTML = `<div class="eyebrow">Out of play</div><h2>Off the board</h2>${group(0, 'Your tribe')}${group(1, BOT.name)}
    <div class="btns"><span></span><button class="btn" id="qvClose">Close</button></div>`;
  $('overlay').hidden = false;
  $('qvClose').onclick = () => { $('overlay').hidden = true; };
  $('panel').querySelectorAll('[data-gone]').forEach(b => b.onclick = () => { const x = G.gone.find(g => g.uid === +b.dataset.gone); if (x) gameQuickView({ id: x.id }, { where: 'gone' }); });
};
$('playBtn').onclick = startMatch;
$('endBtn').onclick = () => { if (G && G.over) finish(); else endTurn(); };
$('idolBtn').onclick = () => { if (!busy && playIdol(G, 0)) { logLine(G.turn === G.lastTurn ? 'You play your idol. Votes double!' : 'You play your idol. Votes double next turn.', 'me'); render(); pulse($('stakes')); } };
$('quitBtn').onclick = () => {
  if (G && G.over) { if (!busy) goHome(); return; }
  if (busy) return;
  if (!quitArmed) { quitArmed = true; render(); setTimeout(() => { if (quitArmed) { quitArmed = false; if (G && !G.over) render(); } }, 3000); return; }
  quitArmed = false; quit(G, 0); matchOver();
};
// Inspect: a card, enlarged, with its details underneath. Tap anywhere to close.
function closeInspect() { $('inspect').hidden = true; }
$('inspect').addEventListener('click', closeInspect);
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('inspect').hidden) closeInspect(); });
// Unrevealed locations reveal leftmost first, one per turn through turn 3
const revealTurn = li => Math.max(G.turn, 0) + 1 + G.locs.slice(0, li).filter(L => !L.revealed).length;
// Tokens aren't collected, so they have no tier: label them by the card that makes them
const TOKEN_FROM = { blackberry: 'Shane Powers', rat: 'Sue Hawk', snake: 'Sue Hawk', goat: 'Brian Heidik', fakeidol: 'Bob Crowley' };
const tierOf = id => TIERS_INFO[CARD_TIER[id]] || { name: CARD[id] && CARD[id].token ? `Token${TOKEN_FROM[id] ? ' from ' + TOKEN_FROM[id] : ''}` : '' };
function gameQuickView(c, ctx = {}) {
  const d = CARD[c.id], tier = tierOf(c.id);
  const pow = ctx.pow != null ? ctx.pow : d.power;
  // Jeff in your hand shows today's twist (your opponent can't see your hand)
  const tw = c.id === 'jeff' && G && !G.over && c.owner === 0 && (ctx.where === 'hand' || ctx.where === 'staged') ? twistFor(G, 0) : null;
  const played = c.id === 'jeff' && c.twist ? TWISTS.find(t => t.id === c.twist) : null; // a Jeff on the board shows the twist he landed on
  $('insp').innerHTML = `${cardHTML(c, { pow: ctx.pow, cls: ctx.locked ? 'locked' : '' })}
    <div class="insp-txt"><div class="eyebrow">${KW[d.kw]} · ${tier.name}</div><h2>${esc(d.name)}</h2>
      <div class="stats">${d.cost} fire · ${pow} influence${pow !== d.power ? ` (base ${d.power})` : ''} · ${ARCH[d.arch]}</div>
      ${played ? `<p class="ability"><b>Turn ${c.twistTurn} twist: “${esc(played.line)}”</b> ${esc(played.text)}</p>` : tw ? `<p class="ability"><b>Today: “${esc(tw.line)}”</b> ${esc(tw.text)}</p><p class="note" style="color:var(--sand-dim)">Tomorrow brings a different twist. None repeats this game.</p>` : `<p class="ability">${d.text}</p>`}${c.idol ? '<p class="note">Holding a hidden idol.</p>' : ''}${ctx.where === 'staged' ? '<p class="note" style="color:var(--sand-dim)">Drag it back to your hand to take it back.</p>' : ''}${ctx.note ? `<p class="note" style="color:var(--sand-dim)">${ctx.note}</p>` : ''}</div>`;
  $('inspect').hidden = false;
}
function locQuickView(li) {
  const L = G.locs[li], def = LOC[L.id], a = L.revealed ? ART.locs[L.id] : null;
  const t = total(G, li, 1), y = total(G, li, 0);
  $('insp').innerHTML = `<div class="loc ${L.revealed ? '' : 'hidden'} ${hasArt(a) ? 'art' : ''}"${locGameStyle(a)}>
      <span class="tot t ${t > y ? 'win' : ''}">${t}</span><h3>${L.revealed ? def.name : 'Unrevealed'}</h3><p>${L.revealed ? def.text : `Reveals on turn ${revealTurn(li)}.`}</p><span class="tot y ${y > t ? 'win' : ''}">${y}</span></div>
    <div class="insp-txt"><div class="eyebrow">Location ${li + 1}</div><div class="stats">You ${y} · ${esc(BOT.name)} ${t}</div></div>`;
  $('inspect').hidden = false;
}
// Drag to play: from the hand onto a location; a card placed this turn can be dragged to another location or back to the hand.
let drag = null;
const laneAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('.lane'); };
const overHand = (x, y) => { const r = $('hand').getBoundingClientRect(); return y > r.top - 20; };
function startDrag(e, el, from) {
  if (!G || G.over || busy) return;
  drag = { uid: +el.dataset.uid, x0: e.clientX, y0: e.clientY, el, from, moved: false, ghost: null, over: null };
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
}
function moveDrag(e) {
  if (!drag || busy) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 10) return;
  if (!drag.moved) {
    const c = drag.from === 'hand' ? G.players[0].hand.find(x => x.uid === drag.uid) : (G.players[0].staged.find(x => x.card.uid === drag.uid) || {}).card;
    if (!c) { drag = null; return; }
    drag.moved = true; drag.card = c;
    if (drag.from === 'staged') unstage(G, 0, c.uid); // free its fire and space while it's in the air
    drag.ghost = drag.el.cloneNode(true); drag.ghost.className = drag.ghost.className.replace('staged', '') + ' ghost'; drag.ghost.removeAttribute('data-uid'); drag.ghost.style.transform = 'none';
    document.body.appendChild(drag.ghost); drag.el.style.opacity = '.2';
    document.querySelectorAll('.lane').forEach(l => l.classList.toggle('ok', canStage(G, 0, c, +l.dataset.li)));
  }
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  const l = laneAt(e.clientX, e.clientY);
  if (drag.over !== l) { if (drag.over) drag.over.classList.remove('drop'); drag.over = l; if (l && canStage(G, 0, drag.card, +l.dataset.li)) l.classList.add('drop'); }
}
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  document.querySelectorAll('.lane').forEach(l => l.classList.remove('ok', 'drop'));
  if (!d.moved) {
    if (e.type !== 'pointerup') return;
    if (d.from === 'hand') { const c = G.players[0].hand.find(x => x.uid === d.uid); if (c) gameQuickView(c, { where: 'hand' }); }
    else { const s = G.players[0].staged.find(x => x.card.uid === d.uid); if (s) gameQuickView(s.card, { where: 'staged' }); }
    return;
  }
  const l = e.type === 'pointerup' ? laneAt(e.clientX, e.clientY) : null;
  if (l && !busy && !(d.from === 'staged' && e.type === 'pointerup' && overHand(e.clientX, e.clientY) && !l)) {
    if (!stage(G, 0, d.uid, +l.dataset.li)) {
      toast(CARD[d.card.id].cost > fireLeft(G, 0) ? 'Not enough fire for that card.' : 'No room there.');
      l.classList.add('shake'); setTimeout(() => l.classList.remove('shake'), 300);
    }
  }
  render();
}
$('hand').addEventListener('pointerdown', e => { const el = e.target.closest('.card'); if (el) startDrag(e, el, 'hand'); });
$('board').addEventListener('pointerdown', e => { const el = e.target.closest('.card.staged'); if (el) startDrag(e, el, 'staged'); });
for (const box of ['hand', 'board']) {
  $(box).addEventListener('pointermove', moveDrag);
  $(box).addEventListener('pointerup', endDrag);
  $(box).addEventListener('pointercancel', endDrag);
}
// Keyboard: Enter inspects a card in hand; 1, 2 or 3 plays it at that location.
$('hand').addEventListener('keydown', e => {
  const el = e.target.closest('.card'); const c = el && G.players[0].hand.find(x => x.uid === +el.dataset.uid); if (!c) return;
  if (e.key === 'Enter') gameQuickView(c, { where: 'hand' });
  if (['1', '2', '3'].includes(e.key) && !busy && !G.over && stage(G, 0, c.uid, +e.key - 1)) render();
});
$('board').addEventListener('click', e => {
  if (!G) return;
  const cardEl = e.target.closest('.card'), locEl = e.target.closest('.loc');
  if (cardEl && cardEl.classList.contains('staged')) return; // handled by the drag code
  if (cardEl && cardEl.dataset.uid) {
    const uid = +cardEl.dataset.uid;
    for (const L of G.locs) for (const side of L.sides) { const c = side.find(x => x.uid === uid); if (c) { gameQuickView(c, { where: 'board', pow: power(G, c) }); return; } }
    for (const L of G.locs) { const c = L.hid[0].find(x => x.uid === uid); if (c) { gameQuickView(c, { note: 'Face-down until the end of the game. It adds no influence and its ability waits until then.' }); return; } }
  }
  if (locEl) locQuickView(+locEl.dataset.loc);
});
$('board').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('lane')) e.target.click(); });

$('rulesBtn').onclick = () => {
  $('panel').className = 'panel';
  $('panel').innerHTML = `<div class="eyebrow">How to play</div><h2>Outwit, outplay, outlast</h2>
  <ul>
    <li><b>Drag a card</b> from your hand onto a location to play it. Drag it back down to take it back before you end the turn. <b>Tap any card or location</b> to see it up close.</li>
    <li><b>Win 2 of 3 locations.</b> After the final turn (usually turn 6), whoever has more influence at a location wins it. If you split, total influence breaks the tie.</li>
    <li><b>Fire is your energy.</b> You get 1 fire on turn 1, 2 on turn 2, and so on. Some cards and locations give extra fire. Cards cost fire.</li>
    <li><b>Face-down cards.</b> Cards played at The Voting Booth, or next to Natalie White, stay face-down until the game ends. They add no influence until then, and nothing can target them. At the end they flip in the order played.</li>
    <li><b>Six turns, sometimes seven.</b> The Outback stretches the game to 7 turns, and Elisabeth Hasselbeck can turn any location into The Outback. Votes double on the final turn either way.</li>
    <li><b>Plays are secret.</b> Both tribes play at the same time. The tribe winning more locations reveals first.</li>
    <li><b>Locations reveal</b> on turns 1, 2 and 3. Each has a twist.</li>
    <li><b>Voted out</b> cards leave the game. A hidden idol (gold diamond) saves a card once.</li>
    <li><b>Scenarios</b> resolve their effect and disappear.</li>
    <li><b>Play your idol</b> to double the jury votes at stake, starting next turn. Votes also double on the final turn.</li>
    <li><b>Quit</b> any time to lose only the current votes instead of risking more.</li>
    <li><b>Rice</b> comes from wins only: 20 per win. Spend ${PACK_COST} on Tree Mail for ${PACK_SIZE} cards, all ones you don't own yet. No duplicates.</li>
    <li><b>Tiers unlock with rank:</b> Pre-Merge at Swing Vote, The Merge at Merged, Legends at Juror.</li>
  </ul>
  <div class="btns"><span></span><button class="btn primary" id="closeRules">Got it</button></div>`;
  $('overlay').hidden = false;
  $('closeRules').onclick = () => { $('overlay').hidden = true; };
};

renderHome();
initCapabilities();
</script>
